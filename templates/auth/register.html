{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
  <div class="card p-4">
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Feed Kind" height="64">
    </div>
    <h3 class="mb-3 text-center" style="color: var(--color-primary);">Create an Account</h3>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" name="name" value="{{ form.get('name', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{ form.get('email', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="phone" value="{{ form.get('phone', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="address" rows="2">{{ form.get('address', '') }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label d-block">Register as</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role" value="DONOR" id="roleDonor"
                 {% if form.get('role') == 'DONOR' %}checked{% endif %} required>
          <label class="form-check-label" for="roleDonor">Food Donor</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role" value="NGO" id="roleNgo"
                 {% if form.get('role') == 'NGO' %}checked{% endif %}>
          <label class="form-check-label" for="roleNgo">NGO</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-secondary">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
