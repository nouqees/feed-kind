{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container" style="max-width: 420px;">
  <div class="card p-4">
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Feed Kind" height="64">
    </div>
    <h3 class="mb-3 text-center" style="color: var(--color-primary);">Login</h3>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{ email }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-secondary">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
