<nav class="navbar navbar-expand-lg navbar-app sticky-top px-3">
  <a class="navbar-brand" href="{{ url_for('main.home') }}">
    <img src="{{ url_for('static', filename='images/logo-mark.png') }}" alt="Feed Kind" height="36">
    <span class="brand-text">
      <span>Feed Kind</span>
      <span class="brand-tagline">Share Food. Spread Kindness.</span>
    </span>
  </a>
  <div class="ms-auto">
    {% if session.get('user_id') %}
      <span class="me-3 text-secondary">{{ session.get('user_name') }} ({{ session.get('user_role') }})</span>

    {% else %}
      <a class="btn btn-sm btn-outline-secondary me-2" href="{{ url_for('auth.login') }}">Login</a>
