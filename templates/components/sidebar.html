{% macro render(items, active) %}
<nav class="col-md-3 col-lg-2 sidebar p-3">
  <ul class="nav flex-column">
    {% for item in items %}
      <li class="nav-item">
        <a class="nav-link {% if active == item.key %}active{% endif %}" href="{{ item.url }}">{{ item.label }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
{% endmacro %}
